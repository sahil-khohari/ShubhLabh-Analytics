services:
  - type: web
    name: shubhlabh-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shubhlabh-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: shubhlabh-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        fromService:
          type: web
          name: shubhlabh-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: shubhlabh-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: shubhlabh-cache
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: shubhlabh-cache
          property: port
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "ShubhLabh Analytics"

  - type: keyvalue
    name: shubhlabh-cache
    plan: free
    ipAllowList: []

databases:
  - name: shubhlabh-db
    databaseName: shubhlabh
    user: shubhlabh_user
    plan: free
