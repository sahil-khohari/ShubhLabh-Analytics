databases:
  - name: shubhlabh-db
    databaseName: shubhlabh
    user: shubhlabh_user

services:
  - type: redis
    name: shubhlabh-redis
    ipAllowList: []
    plan: free

  - type: web
    name: shubhlabh-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shubhlabh-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: shubhlabh-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: shubhlabh-redis
          property: port
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false

  - type: web
    name: shubhlabh-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_URL
        sync: false
