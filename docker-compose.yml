version: '3.8'

services:
  db:
    image: postgres:15
    container_name: retail_db
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      POSTGRES_DB: retail_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: retail_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
